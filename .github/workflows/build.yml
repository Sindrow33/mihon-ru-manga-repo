name: Build extensions

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'apk/**'
      - 'icon/**'
      - 'index.json'
      - 'index.min.json'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is missing"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d > signingkey.jks
          chmod 600 signingkey.jks

      - name: Build release APKs
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MODULES=$(find src -mindepth 2 -maxdepth 2 -type d -printf ':src:%P\n' | tr '/' ':' | sed 's/$/:assembleRelease/' | tr '\n' ' ')
          echo "Building: $MODULES"
          ./gradlew --no-daemon --stacktrace $MODULES

      - name: Collect APKs and source info
        run: |
          rm -rf apk source-info
          mkdir -p apk source-info
          find src -path '*/build/outputs/apk/release/*.apk' -exec cp {} apk/ \;
          find src -name 'keiyoushi-source-info.json' -print0 | while IFS= read -r -d '' f; do
            module=$(echo "$f" | sed -E 's|^src/([^/]+)/([^/]+)/build/.*|\1.\2|')
            cp "$f" "source-info/$module.json"
          done
          ls -l apk source-info

      - name: Create repo index
        run: python3 ./.github/scripts/create-repo.py

      - name: Clean up CI files
        run: rm -f signingkey.jks && rm -rf source-info

      - name: Commit repo
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: publish extensions [skip ci]"
          add: "apk icon index.json index.min.json"
          default_author: github_actions
